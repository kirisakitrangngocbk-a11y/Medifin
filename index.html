<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>MEDIFIN — Financial Clinic</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app">
      <header class="topbar">
        <a class="brand" href="#" id="brandHome" aria-label="Về menu MEDIFIN">
          <span class="brand-mark">M</span>
          <span>MEDIFIN</span>
        </a>
        <div class="topbar-center" id="topbarContext"></div>
        <div class="topbar-actions">
          <span class="save-status" id="saveStatus"><i></i> Auto-saved</span>
          <button class="text-btn topbar-menu-btn" type="button" id="menuBtn">Menu</button>
        </div>
      </header>

      <main id="mainContent"></main>

      <footer class="footer section-wrap">
        <span>MEDIFIN © 2026</span>
        <span>Learning simulation · Không phải tư vấn tài chính thực tế</span>
        <span id="footerContext">Case selection</span>
      </footer>
    </div>

    <div class="modal-backdrop hidden" id="evidenceModal" role="presentation">
      <section class="evidence-modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <div>
            <span class="eyebrow">EVIDENCE DETAIL</span>
            <h2 id="modalTitle">Evidence</h2>
          </div>
          <button class="icon-close" type="button" id="modalClose" aria-label="Đóng">×</button>
        </div>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
